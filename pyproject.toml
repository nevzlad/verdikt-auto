[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verdikt-auto"
version = "0.1.0"
description = "AI-powered Telegram channel automation for news analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Verdikt Team", email = "team@verdikt-auto.local" },
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "python-telegram-bot[job-queue]>=21.1",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "rich>=13.7.0",
    "edge-tts>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
verdikt-auto = "verdikt_auto.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["verdikt_auto*"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_any_unimported = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
